[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfextract"
version = "1.0.2"
description = "Motor de extracción y análisis documental de pólizas y documentos complejos con Docling y PaddleOCR-VL"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "OGOS" }
]
keywords = [
    "pdf",
    "ocr",
    "docling",
    "paddleocr",
    "table-extraction",
    "insurance",
    "document-processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.8",
    "tqdm>=4.66.4",
    "pillow>=10.3.0",
    "numpy>=1.26.4",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.30.0",
    "docling>=2.0.0",
    "docling-core>=2.0.0",
    "paddlepaddle>=3.0.0b1; sys_platform != 'darwin'",
    "paddleocr>=2.8.0",
    "transformers>=4.45.0",
    "torch>=2.2.0",
    "accelerate>=0.30.0",
    "timm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]
gpu = [
    "paddlepaddle-gpu>=3.0.0b1; sys_platform != 'darwin'",
]

[project.scripts]
pdfextract = "pdfextract.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfextract*", "app*"]

[tool.setuptools.package-data]
pdfextract = ["*.yaml", "*.yml"]
